services:
  # 1. FastAPI Python AI Backend Web Service
  - type: web
    name: smartclassroom-api
    runtime: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn ai_engine.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: AI_API_SECRET_TOKEN
        value: smartclassroom-secure-ipc-token-2026
      - key: DEFAULT_CAMERA_PROVIDER
        value: MOCK
      - key: FIREBASE_RTDB_URL
        value: https://classroomcam-1b81d-default-rtdb.asia-southeast1.firebasedatabase.app

  # 2. React + Vite Frontend Static Site (Served via Render Global CDN)
  - type: web
    name: smartclassroom-ui
    runtime: static
    rootDir: desktop/frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_FIREBASE_DATABASE_URL
        value: https://classroomcam-1b81d-default-rtdb.asia-southeast1.firebasedatabase.app
      - key: VITE_FIREBASE_PROJECT_ID
        value: classroomcam-1b81d
      - key: VITE_AI_API_TOKEN
        value: smartclassroom-secure-ipc-token-2026
      - key: VITE_AI_BACKEND_URL
        value: https://smartclassroom-api-h96b.onrender.com
